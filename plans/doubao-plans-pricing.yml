description: >-
  Volcano Engine Ark exposes pay-as-you-go per-token pricing across the Doubao model family,
  with separate per-call pricing for image (Seedream), video (Seedance), 3D, and TTS surfaces.
  Pricing primarily published in CNY on the Volcano Engine console.
notes: >-
  Verify CNY-denominated rates on the Volcano Engine pricing pages. Doubao-Seed-Code, Doubao-Pro,
  Doubao-Lite tiers are all available; deep-reasoning variants are billed separately.
