description: >-
  Doubao is ByteDance's foundation model family, served via the Volcano Engine Ark platform.
  Offers chat completions, deep reasoning, multimodal vision, embeddings, image generation
  (Seedream), video generation (Seedance), 3D generation, and TTS through OpenAI-compatible
  and native endpoints.
